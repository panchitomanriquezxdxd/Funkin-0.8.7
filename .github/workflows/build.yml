name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7

jobs:
  android:
    name: Android (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One APK containing both ABIs, installs on any ARM Android device.
          # (This is also what a plain `lime build android` produces.)
          - name: universal
            arch_flags: "-armv7 -arm64"
          # 32-bit ARM only (armeabi-v7a).
          - name: armeabi-v7a
            arch_flags: "-armv7"
          # 64-bit ARM only (arm64-v8a).
          - name: arm64
            arch_flags: "-arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Cache Android SDK packages
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
          key: android-sdk-ndk27.2.12479018-platform35-buildtools35.0.0

      - name: Install Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android
        shell: bash
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Install dependencies
        shell: bash
        run: haxelib run hmm install

      # hmm clones Lime without its submodules (SDL, OpenAL, dr_libs...), and `lime rebuild` fails
      # with "dr_flac.h: No such file or directory" without them.
      - name: Fetch Lime native submodules
        shell: bash
        run: |
          LIME_PATH=$(haxelib libpath lime | tr -d '\n')
          git -C "$LIME_PATH" submodule update --init --recursive --depth 1
          test -f "$LIME_PATH/project/lib/dr_libs/dr_flac.h"

      - name: Build hxcpp
        shell: bash
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp | tr -d '\n')
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        shell: bash
        run: haxelib run lime rebuild cpp

      - name: Setup Lime Android
        shell: bash
        run: |
          haxelib run lime setup android <<EOF
          $ANDROID_SDK_ROOT
          $ANDROID_NDK_ROOT
          $JAVA_HOME
          EOF

      - name: Rebuild Lime Android
        shell: bash
        run: haxelib run lime rebuild android -armv7 -arm64

      - name: Build Android (${{ matrix.name }})
        shell: bash
        run: |
          set -o pipefail
          haxelib run lime build android ${{ matrix.arch_flags }} -release -DGITHUB_BUILD 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
          if-no-files-found: ignore

      # Release APKs come out unsigned, which Android refuses to install.
      # Sign them with a throwaway key so they can be sideloaded.
      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK_IN=$(find export/release/android -name "*.apk" | head -n 1)
          if [ -z "$APK_IN" ]; then echo "No APK found"; exit 1; fi
          echo "Input APK: $APK_IN"

          keytool -genkeypair -v -keystore ci.keystore -alias funkin \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass funkin123 -keypass funkin123 \
            -dname "CN=Funkin CI, O=Funkin, C=US"

          mkdir -p dist
          # -P 16 page-aligns uncompressed .so files to 16 KB (a superset of the old 4 KB `-p`),
          # which Android 15+ devices running a 16 KB page kernel require.
          "$BUILD_TOOLS/zipalign" -f -P 16 4 "$APK_IN" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks ci.keystore --ks-key-alias funkin \
            --ks-pass pass:funkin123 --key-pass pass:funkin123 \
            --out "dist/Funkin-0.8.7-${{ matrix.name }}.apk" aligned.apk
          "$BUILD_TOOLS/apksigner" verify "dist/Funkin-0.8.7-${{ matrix.name }}.apk"
          ls -lh dist

      # Fail the job if the APK doesn't contain exactly the ABIs this matrix entry promises,
      # or if a 64-bit library isn't 16 KB aligned (it would refuse to load on newer devices).
      - name: Verify APK (ABIs + 16 KB alignment)
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/Funkin-0.8.7-${{ matrix.name }}.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          case "${{ matrix.name }}" in
            universal)   want="arm64-v8a armeabi-v7a" ;;
            armeabi-v7a) want="armeabi-v7a" ;;
            arm64)       want="arm64-v8a" ;;
            *) echo "Unknown matrix entry"; exit 1 ;;
          esac

          have=$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/libApplicationMain\.so$#\1#p' | sort | xargs)
          want_sorted=$(echo "$want" | tr ' ' '\n' | sort | xargs)
          echo "ABIs expected: [$want_sorted]  found: [$have]"
          if [ "$have" != "$want_sorted" ]; then
            echo "::error::ABI mismatch in $APK"
            exit 1
          fi

          # Zip-level 16 KB alignment of the native libraries.
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" > /dev/null

          # ELF-level: every PT_LOAD segment of every 64-bit lib must be aligned to >= 16 KB.
          mkdir -p verify-libs
          for abi in arm64-v8a; do
            if echo " $want_sorted " | grep -q " $abi "; then
              for lib in $(unzip -Z1 "$APK" | grep -E "^lib/$abi/.*\.so$"); do
                unzip -p "$APK" "$lib" > verify-libs/current.so
                bad=0
                for align in $("$READELF" -lW verify-libs/current.so | awk '$1=="LOAD"{print $NF}'); do
                  if [ $((align)) -lt 16384 ]; then bad=1; fi
                done
                if [ "$bad" = "1" ]; then
                  echo "::error::$lib has a LOAD segment aligned below 16 KB"
                  exit 1
                fi
              done
              echo "16 KB alignment OK for $abi libraries"
            fi
          done

      - name: Upload Android (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android-${{ matrix.name }}
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Install dependencies
        shell: bash
        run: haxelib run hmm install

      # hmm clones Lime without its submodules, `lime rebuild` needs them (SDL, OpenAL, dr_libs...).
      - name: Fetch Lime native submodules
        shell: bash
        run: |
          LIME_PATH=$(haxelib libpath lime | tr -d '\r\n')
          git -C "$LIME_PATH" submodule update --init --recursive --depth 1
          test -f "$LIME_PATH/project/lib/dr_libs/dr_flac.h"

      - name: Build hxcpp
        shell: bash
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp | tr -d '\r\n')
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        shell: bash
        run: haxelib run lime rebuild windows

      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          haxelib run lime build windows -release -DGITHUB_BUILD 2>&1 | tee build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: build.log
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          $bin = "export/release/windows/bin"
          if (-not (Test-Path "$bin/Funkin.exe")) {
            Write-Error "Funkin.exe not found in $bin"
            Get-ChildItem $bin -ErrorAction SilentlyContinue
            exit 1
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$bin/*" -DestinationPath "dist/Funkin-0.8.7-windows-x64.zip" -CompressionLevel Optimal
          Get-ChildItem dist

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Windows
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Publishes the builds as a GitHub Release (marked as a pre-release) so they can be downloaded without logging in.
  release:
    name: Publish release
    needs: [android, windows]
    # Publish what was built, even if one platform failed.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: builds
          pattern: Funkin-*
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          set -euo pipefail
          ls -lh builds
          BRANCH="${GITHUB_REF_NAME}"
          gh release create "$TAG" builds/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Build ${{ github.run_number }} (${BRANCH})" \
            --notes "Automatic build of \`${BRANCH}\` at ${GITHUB_SHA::7}.

          - **Android**: install \`Funkin-0.8.7-universal.apk\` on any ARM phone. The \`armeabi-v7a\` and \`arm64\` files are single-architecture versions.
          - **Windows**: extract \`Funkin-0.8.7-windows-x64.zip\` and run \`Funkin.exe\`.

          The APKs are signed with a throwaway CI key: uninstall a previous build signed with another key before installing."
