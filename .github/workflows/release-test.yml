name: Release test

# Temporary: checks how a release can be created from CI. Runs when this file changes on the feature branch.
on:
  push:
    branches: [feature/online-android-v2]
    paths: [.github/workflows/release-test.yml]

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mode: [sha, branch, no-target]
    steps:
      - name: Try to create a release (${{ matrix.mode }})
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: release-test-${{ matrix.mode }}-${{ github.run_number }}
        run: |
          echo hello > test.txt
          case "${{ matrix.mode }}" in
            sha)       TARGET="--target $GITHUB_SHA" ;;
            branch)    TARGET="--target $GITHUB_REF_NAME" ;;
            no-target) TARGET="" ;;
          esac
          set +e
          gh release create "$TAG" test.txt --repo "$GITHUB_REPOSITORY" $TARGET --prerelease --title "test" --notes "test"
          code=$?
          echo "exit code: $code"
          [ $code -eq 0 ] && gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          exit $code
